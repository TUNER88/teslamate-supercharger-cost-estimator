# Paste under services: in your TeslaMate docker-compose.yml
# Image: ghcr.io/tuner88/teslamate-supercharger-cost-estimator:latest
#
# Only DATABASE_PASS is required; see README for the full env table.
# mkdir -p suc-estimator-cache
# docker compose pull suc-estimator
# Dry-run:  docker compose run --rm suc-estimator --dry-run
# Apply:    docker compose run --rm suc-estimator
# Cron:     0 6,18 * * * cd /path/to/teslamate && docker compose run --rm suc-estimator

  suc-estimator:
    image: ghcr.io/tuner88/teslamate-supercharger-cost-estimator:latest
    container_name: teslamate-suc-estimator
    restart: "no"
    depends_on:
      - database
    environment:
      - DATABASE_PASS=${DATABASE_PASS}
    volumes:
      - ./suc-estimator-cache:/cache
