name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tuner88/teslamate-supercharger-cost-estimator

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version ${VERSION}"

      - name: Check if this version is already released
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist yet"
          fi

      - name: Build release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os

          version = os.environ["VERSION"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()

          start = next(
              (i for i, line in enumerate(lines) if line.startswith(f"## [{version}]")),
              None,
          )
          if start is None:
              section = f"## [{version}]\n\n_No CHANGELOG section found for this version._\n"
          else:
              end = len(lines)
              for j in range(start + 1, len(lines)):
                  line = lines[j]
                  if line.startswith("## ["):
                      end = j
                      break
                  # Keep a Changelog link footer: [0.2.0]: https://...
                  if line.startswith("[") and "]:" in line and not line.startswith("[Unreleased]"):
                      # only treat as footer when it looks like a version link line
                      label = line[1 : line.index("]")]
                      if label == "Unreleased" or label[0].isdigit():
                          end = j
                          break
              section = "\n".join(lines[start:end]).strip() + "\n"

          image = f"ghcr.io/tuner88/teslamate-supercharger-cost-estimator:{version}"
          body = (
              f"{section}\n"
              f"---\n\n"
              f"**Docker image:** `{image}`\n"
          )
          Path("release-body.md").write_text(body, encoding="utf-8")
          print(body)
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # On main: when pyproject version has no GitHub Release yet, create tag vX.Y.Z + release.
      # On tag push: create the release if it is still missing (manual tags).
      # Body is the matching CHANGELOG section (Added/Changed/…), not just a link.
      - name: Create GitHub Release
        if: >-
          (github.ref == 'refs/heads/main' && steps.release_check.outputs.exists == 'false')
          || (startsWith(github.ref, 'refs/tags/v') && steps.release_check.outputs.exists == 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-body.md
          generate_release_notes: true
          files: |
            deploy/docker-compose.snippet.yml

      # Keep an existing release's notes in sync with CHANGELOG (e.g. first publish after this fix).
      - name: Refresh existing release notes from CHANGELOG
        if: >-
          github.ref == 'refs/heads/main'
          && steps.release_check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --notes-file release-body.md
